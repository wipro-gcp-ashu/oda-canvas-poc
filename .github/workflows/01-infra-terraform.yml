name: "01 - Provision GCP Infrastructure & Private GKE (Terraform)"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to execute"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'gcp-oda-canvas-poc' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME || 'oda-canvas-mt-gke' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'gcp-oda-canvas-poc-tfstate' }}

jobs:
  terraform-gcp:
    name: "Provision GCP Project Resources & Private GKE"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Configure Remote GCS Backend & Initialize Terraform
        run: |
          if [[ -n "${TF_STATE_BUCKET}" ]]; then
            cat <<EOF > backend.tf
          terraform {
            backend "gcs" {
              bucket = "${TF_STATE_BUCKET}"
              prefix = "oda-canvas-multitenant-poc/infra"
            }
          }
          EOF
          fi
          terraform init

      - name: Terraform Validate & Format Check
        run: |
          terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="cluster_name=${CLUSTER_NAME}" \
            -out=tfplan

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        run: |
          terraform apply -auto-approve tfplan
